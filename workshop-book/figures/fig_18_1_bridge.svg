<rect x="1250" y="640" width="300" height="120" rx="14" fill="#fff" stroke="#B6684F" stroke-width="4" opacity="1"/>
<text x="1400" y="692" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="700" fill="#B6684F" text-anchor="middle" letter-spacing="0">জীবিকা ও সমতা</text>
<text x="1400" y="732" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="25" font-weight="400" fill="#55636E" text-anchor="middle" letter-spacing="0">আয়, প্রবেশাধিকার</text>
