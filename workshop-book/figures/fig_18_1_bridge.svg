<text x="1560" y="520" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="24" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">নিরেট তীর: আহরণ মৃত্যুহার বাড়ায় (প্রতিষ্ঠিত মৎস্য-বিজ্ঞান)</text>
