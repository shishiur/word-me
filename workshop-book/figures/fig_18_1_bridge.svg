<text x="620" y="212" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="25" font-weight="400" fill="#55636E" text-anchor="middle" letter-spacing="0">স্ট্রেস-সূচক, কর্টিসল</text>
