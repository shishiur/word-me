<text x="170" y="1084.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">বিন্দু: অনিশ্চিত সম্ভাবনা; কার্যকারণ নয়</text>
<text x="1595" y="1185" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="25" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">সম্পূর্ণ কাল্পনিক শিক্ষণ-চিত্র। ইলিশ-নির্দিষ্ট কোনো সম্পর্ক পরিমাপিত নয়; প্রতিটি তীর পরীক্ষাযোগ্য প্রশ্ন।</text></svg>