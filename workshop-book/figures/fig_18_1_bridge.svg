<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1200" width="161.5mm" height="120.0mm" role="img" aria-labelledby="t d"><title id="t">গবেষণা-সেতু: অনুমিত পথ</title><desc id="d">দুই স্তরের নেটওয়ার্ক: উপরে পানির অবস্থা, মাছের শারীরবৃত্ত, অন্ত্রের ও পানির জীবাণুসমষ্টি, পরিযান; নিচে লিজ, নিষেধাজ্ঞা, আহরণ-চাপ, জীবিকা। বেশিরভাগ তীর ড্যাশ বা বিন্দু, অর্থাৎ অনুমিত বা অনিশ্চিত।</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1200" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="20" y="20" width="1575" height="480" rx="16" fill="#EFF6F8" stroke="#4D94B5" stroke-width="2" opacity="1"/>
