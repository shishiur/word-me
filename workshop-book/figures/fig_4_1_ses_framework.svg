<text x="60" y="940" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="700" fill="#4E7960" text-anchor="start" letter-spacing="0">সংশ্লিষ্ট প্রতিবেশ-ব্যবস্থা (ECO): জলবায়ু, দূষণ, ফোকাল SES-এ প্রবাহ</text>
<text x="1565" y="970" font-family="Tinos, Noto Serif Bengali, serif" font-size="25" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Ostrom (2007 Fig.1; 2009 Fig.1) অবলম্বনে সরলীকৃত মৌলিক পুনর্নির্মাণ</text></svg>