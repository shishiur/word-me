<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1000" width="161.5mm" height="100.0mm" role="img" aria-labelledby="t d"><title id="t">সামাজিক-প্রতিবেশ ব্যবস্থা কাঠামো</title><desc id="d">চারটি মূল উপব্যবস্থা: সম্পদ-ব্যবস্থা, সম্পদ-একক, শাসন-ব্যবস্থা ও ব্যবহারকারী, যারা মিথস্ক্রিয়া ও ফল তৈরি করে; চারপাশে সামাজিক প্রেক্ষাপট ও সংশ্লিষ্ট প্রতিবেশ-ব্যবস্থা।</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1000" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="20" y="20" width="1575" height="960" rx="20" fill="#F7F4EC" stroke="#C9D6DC" stroke-width="2" opacity="1"/>
