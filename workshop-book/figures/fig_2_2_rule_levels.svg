<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 640" width="161.5mm" height="64.0mm" role="img" aria-labelledby="t d"><title id="t">নিয়মের তিন স্তর</title><desc id="d">সাংবিধানিক, সম্মিলিত-পছন্দ ও পরিচালন স্তরের নিয়ম; প্রতিটির প্রশ্ন ও কাল্পনিক উদাহরণ।</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="640" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="40" y="40" width="1535" height="170" rx="16" fill="#fff" stroke="#103553" stroke-width="4" opacity="1"/>
<rect x="40" y="40" width="18" height="170" rx="6" fill="#103553" stroke="none" stroke-width="0" opacity="1"/>
<text x="80" y="98" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">সাংবিধানিক স্তর · Constitutional</text>
<text x="80" y="148" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">কে নিয়ম বানানোর নিয়ম ঠিক করবে?</text>
<text x="80" y="192" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">উদাহরণ: জলমহাল নীতিমালা কে প্রণয়ন করে</text>
<rect x="150" y="230" width="1315" height="170" rx="16" fill="#fff" stroke="#147C80" stroke-width="4" opacity="1"/>
<rect x="150" y="230" width="18" height="170" rx="6" fill="#147C80" stroke="none" stroke-width="0" opacity="1"/>
<text x="190" y="288" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#147C80" text-anchor="start" letter-spacing="0">সম্মিলিত-পছন্দ স্তর · Collective-choice</text>
<text x="190" y="338" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">দৈনন্দিন নিয়ম কে, কীভাবে বদলাবে?</text>
<text x="190" y="382" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">উদাহরণ: সমিতির সভায় জালের ফাঁস ঠিক করা</text>
<rect x="260" y="420" width="1095" height="170" rx="16" fill="#fff" stroke="#4E7960" stroke-width="4" opacity="1"/>
<rect x="260" y="420" width="18" height="170" rx="6" fill="#4E7960" stroke="none" stroke-width="0" opacity="1"/>
<text x="300" y="478" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#4E7960" text-anchor="start" letter-spacing="0">পরিচালন স্তর · Operational</text>
<text x="300" y="528" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">কোথায়, কখন, কী দিয়ে ধরা যাবে?</text>
<text x="300" y="572" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">উদাহরণ: জ্যৈষ্ঠে ডিমওয়ালা মাছ ধরা নিষেধ</text>
<text x="1585" y="628" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">ধারণা: Ostrom (1990, 2005), W10 §5.4-এ ব্যাখ্যাত; উদাহরণগুলো কাল্পনিক শিক্ষণ-উদাহরণ</text></svg>