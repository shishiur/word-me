<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1060" width="161.5mm" height="106.0mm" role="img" aria-labelledby="t d"><title id="t">চিলিকা বনাম শ্রীলঙ্কা</title><desc id="d">দুই কলামের তুলনা: কমন্সের ধরন, ব্যবহারকারী, চালক, প্রতিষ্ঠান, নিয়ম ও সাফল্যের প্রমাণ; নিচে নকশা-সতর্কতা।</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1060" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="40" y="30" width="745" height="90" rx="12" fill="#B6684F" stroke="none" stroke-width="0" opacity="1"/>
<text x="412.5" y="88" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">চিলিকা, ভারত: decommonisation</text>
<rect x="830" y="30" width="745" height="90" rx="12" fill="#4E7960" stroke="none" stroke-width="0" opacity="1"/>
<text x="1202.5" y="88" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">উ.-প. শ্রীলঙ্কা: commonisation</text>
<rect x="40" y="150" width="1535" height="100" rx="8" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="186" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">কোন 'কমন্স'?</text>
<text x="60" y="230" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">লেগুনের প্রথাগত আহরণ-মৎস্যক্ষেত্র</text>
<text x="850" y="230" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">তিন লেগুন + ডাচ খাল: যৌথ পানির উৎস</text>
<rect x="40" y="268" width="1535" height="100" rx="8" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="304" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">কারা ব্যবহারকারী?</text>
<text x="60" y="348" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">জাত-ভিত্তিক জেলে বনাম অ-জেলে উচ্চবর্ণ</text>
<text x="850" y="348" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">~৬০০ ছোট পারিবারিক চিংড়ি-খামার</text>
<rect x="40" y="386" width="1535" height="100" rx="8" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="422" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">চালক</text>
<text x="60" y="466" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">বৈশ্বিক চিংড়ি-দাম; রাষ্ট্রীয় নীতি</text>
<text x="850" y="466" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">রোগ-বিপর্যয় ১৯৮৮–৯৮; বড় কোম্পানি দেউলিয়া</text>
<rect x="40" y="504" width="1535" height="100" rx="8" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="540" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">প্রতিষ্ঠান</text>
<text x="60" y="584" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">সমবায় অচল; CDA, FISHFED কেন্দ্রীভূত</text>
<text x="850" y="584" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">সমিতি ×১৮ → জোন ×৫ → SLADA + NAQDA</text>
<rect x="40" y="622" width="1535" height="100" rx="8" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="658" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">মূল নিয়ম</text>
<text x="60" y="702" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">লিজ-ফি +২৭%; ১৯৯১ নীতি</text>
<text x="850" y="702" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">জোনাল ক্রপ-ক্যালেন্ডার: কখন পানি নেওয়া/ছাড়া</text>
<rect x="40" y="740" width="1535" height="100" rx="8" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="776" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">সাফল্য-প্রমাণ</text>
<text x="60" y="820" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">আয়, সমবায়, এলাকা-দখলের তথ্য</text>
<text x="850" y="820" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">জাতীয় উৎপাদন-বৃদ্ধি (সমষ্টিগত সূচক)</text>
<rect x="40" y="870" width="1535" height="170" rx="12" fill="#FBF4E6" stroke="#D8A34A" stroke-width="3" opacity="1"/>
<text x="62" y="918" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="700" fill="#8a5d0c" text-anchor="start" letter-spacing="0">নকশা-সতর্কতা (Methods বিভাগ অনুযায়ী)</text>
<text x="62" y="968" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">কেস দুটি বাছাই হয়েছে 'তথ্য-সংগ্রহ পদ্ধতির সামঞ্জস্য ও কাছাকাছি সময়কাল (২০০৭–২০১৪)' কারণে, ফল মিলিয়ে নয়।</text>
<text x="62" y="1012" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">তুলনাটি ব্যাখ্যামূলক বৈপরীত্য; একটি একক চলক বদলে কারণ নির্ণয়ের নিয়ন্ত্রিত তুলনা নয়।</text></svg>