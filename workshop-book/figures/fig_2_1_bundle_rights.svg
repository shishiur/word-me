<text x="55" y="772" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="33" font-weight="700" fill="#B6684F" text-anchor="start" letter-spacing="0">চিলিকার প্যারাডক্স (Nayak &amp; Berkes 2011, p.142)</text>
<text x="55" y="825" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">লিজ-ব্যবস্থায় জেলে-গ্রামগুলোর প্রবেশ ও আহরণ আইনি, আর ব্যবস্থাপনা-বর্জন-হস্তান্তর কার্যত ছিল।</text>
<text x="55" y="872" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">২০১০ নাগাদ লিজ-ফি দিয়েও বাস্তবে একটি অধিকারও তাঁদের হাতে নেই; অথচ দখলকারীরা 'thin access'</text>
<text x="55" y="916" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">থেকে কার্যত পূর্ণ অধিকারে পৌঁছেছেন। কাগজের অধিকার ≠ প্রয়োগের ক্ষমতা।</text>
<text x="1585" y="950" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">ধারণা: Schlager &amp; Ostrom (1992), W10 §5.3-এ উদ্ধৃত; মৌলিক পুনর্নির্মাণ</text></svg>