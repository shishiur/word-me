<text x="370" y="1093" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">অবৈধ চাষ চলমান: রক্ষণশীল হিসাবে &gt;৬০% মৎস্য-এলাকা</text>
