<text x="370" y="725" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">রাজ্য-স্তরের FISHFED ও চিলিকা উন্নয়ন কর্তৃপক্ষ (CDA)</text>
