<text x="1595" y="1224" font-family="Tinos, Noto Serif Bengali, serif" font-size="25" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">সব তারিখ Nayak &amp; Berkes (2011) থেকে। সবুজ = commonising, লাল = decommonising, নীল = আইনি/পরিবেশগত হস্তক্ষেপ।</text></svg>