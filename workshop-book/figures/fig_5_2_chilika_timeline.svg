<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1244" width="161.5mm" height="124.4mm" role="img" aria-labelledby="t d"><title id="t">চিলিকা সময়রেখা</title><desc id="d">১৮শ শতক থেকে ২০১০ পর্যন্ত চিলিকা লেগুনের কমন্স-সংক্রান্ত প্রধান ঘটনা, Nayak ও Berkes 2011-এর পৃষ্ঠা-উল্লেখসহ।</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1244" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
