<text x="1605" y="712" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="25" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">y = স্ব-সংগঠনের সম্ভাবনা। Ostrom (2009) পাঠ্যের গুণগত রূপ, মাপা বক্ররেখা নয়। কমলা ড্যাশ = প্রভাব শর্তসাপেক্ষ।</text></svg>