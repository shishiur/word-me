<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 640" width="161.5mm" height="64.0mm" role="img" aria-labelledby="t d"><title id="t">Three levels of rules</title><desc id="d">Constitutional, collective-choice and operational rules, each with its question and a hypothetical example.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="640" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="40" y="40" width="1535" height="170" rx="16" fill="#fff" stroke="#103553" stroke-width="4" opacity="1"/>
<rect x="40" y="40" width="18" height="170" rx="6" fill="#103553" stroke="none" stroke-width="0" opacity="1"/>
<text x="80" y="98" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">Constitutional level</text>
<text x="80" y="148" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Who sets the rules for making rules?</text>
<text x="80" y="192" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">e.g. who drafts the jalmohal (water-body) leasing policy</text>
<rect x="150" y="230" width="1315" height="170" rx="16" fill="#fff" stroke="#147C80" stroke-width="4" opacity="1"/>
<rect x="150" y="230" width="18" height="170" rx="6" fill="#147C80" stroke="none" stroke-width="0" opacity="1"/>
<text x="190" y="288" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#147C80" text-anchor="start" letter-spacing="0">Collective-choice level</text>
<text x="190" y="338" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Who changes everyday rules, and how?</text>
<text x="190" y="382" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">e.g. setting the net mesh at an association meeting</text>
<rect x="260" y="420" width="1095" height="170" rx="16" fill="#fff" stroke="#4E7960" stroke-width="4" opacity="1"/>
<rect x="260" y="420" width="18" height="170" rx="6" fill="#4E7960" stroke="none" stroke-width="0" opacity="1"/>
<text x="300" y="478" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#4E7960" text-anchor="start" letter-spacing="0">Operational level</text>
<text x="300" y="528" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Where, when and with what may one fish?</text>
<text x="300" y="572" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">e.g. no catching of egg-bearing fish in Jyoishtho</text>
<text x="1585" y="628" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Concept: Ostrom (1990, 2005), explained in W10 §5.4; examples are hypothetical teaching examples</text></svg>