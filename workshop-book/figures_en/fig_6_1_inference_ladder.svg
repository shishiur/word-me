<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 900" width="161.5mm" height="90.0mm" role="img" aria-labelledby="t d"><title id="t">The inference ladder</title><desc id="d">Five rungs: description, association, mechanism, causation, policy; each with an example from the assigned readings.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="80" y="760" width="1470" height="120" rx="12" fill="#fff" stroke="#4E7960" stroke-width="4" opacity="1"/>
<rect x="80" y="760" width="20" height="120" rx="6" fill="#4E7960" stroke="none" stroke-width="0" opacity="1"/>
<text x="120" y="810" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="34" font-weight="700" fill="#4E7960" text-anchor="start" letter-spacing="0">1. Descriptive observation</text>
<text x="120" y="855" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">What happened, how much?</text>
<text x="1525" y="832" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="end" letter-spacing="0">95% of cooperatives defunct (W06)</text>
<rect x="150" y="600" width="1330" height="120" rx="12" fill="#fff" stroke="#4D94B5" stroke-width="4" opacity="1"/>
<rect x="150" y="600" width="20" height="120" rx="6" fill="#4D94B5" stroke="none" stroke-width="0" opacity="1"/>
<text x="190" y="650" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="34" font-weight="700" fill="#4D94B5" text-anchor="start" letter-spacing="0">2. Association / correlation</text>
<text x="190" y="695" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">Do X and Y change together?</text>
<text x="1455" y="672" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="end" letter-spacing="0">Farmer-run irrigation: higher crop intensity (W02)</text>
<rect x="220" y="440" width="1190" height="120" rx="12" fill="#fff" stroke="#147C80" stroke-width="4" opacity="1"/>
<rect x="220" y="440" width="20" height="120" rx="6" fill="#147C80" stroke="none" stroke-width="0" opacity="1"/>
<text x="260" y="490" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="34" font-weight="700" fill="#147C80" text-anchor="start" letter-spacing="0">3. Mechanism</text>
<text x="260" y="535" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">By which path does X lead to Y?</text>
<text x="1385" y="512" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="end" letter-spacing="0">V-notch → reliable signal → reciprocity (W03)</text>
<rect x="290" y="280" width="1050" height="120" rx="12" fill="#fff" stroke="#103553" stroke-width="4" opacity="1"/>
<rect x="290" y="280" width="20" height="120" rx="6" fill="#103553" stroke="none" stroke-width="0" opacity="1"/>
<text x="330" y="330" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="34" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">4. Causal inference</text>
<text x="330" y="375" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">What if X were absent?</text>
<text x="1315" y="352" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="end" letter-spacing="0">Random payments → less forest loss (W05)</text>
<rect x="360" y="120" width="910" height="120" rx="12" fill="#fff" stroke="#B6684F" stroke-width="4" opacity="1"/>
<rect x="360" y="120" width="20" height="120" rx="6" fill="#B6684F" stroke="none" stroke-width="0" opacity="1"/>
<text x="400" y="170" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="34" font-weight="700" fill="#B6684F" text-anchor="start" letter-spacing="0">5. Policy recommendation</text>
<text x="400" y="215" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#55636E" text-anchor="start" letter-spacing="0">What should be done?</text>
<text x="1245" y="192" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="end" letter-spacing="0">'Keep commons as commons' (W06)</text>
<line x1="40" y1="860" x2="40" y2="60" stroke="#12334B" stroke-width="5" marker-end="url(#ah-solid)"/>
<text transform="translate(26,460) rotate(-90)" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" fill="#55636E" text-anchor="middle">Each rung needs more assumptions and more evidence</text>
<text x="1595" y="893" font-family="Tinos, Noto Serif Bengali, serif" font-size="24" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Original figure; examples from this book's readings, rung concepts from general research-methods literature</text></svg>