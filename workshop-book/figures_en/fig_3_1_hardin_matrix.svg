<text x="1405.0" y="504" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">harbour-based groups</text>
<rect x="20" y="552" width="1575" height="100" rx="6" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="36" y="612" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">U3–U7 history, leadership, norms</text>
<text x="625.0" y="612" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">isolated, short-term</text>

<text x="1405.0" y="612" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">generations; trust</text>
<rect x="20" y="660" width="1575" height="100" rx="6" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
