<text x="1015.0" y="180" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">coastal waters</text>

<rect x="20" y="228" width="1575" height="100" rx="6" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="36" y="288" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">GS governance</text>
<text x="625.0" y="288" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">none</text>

<text x="1405.0" y="288" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">local rules + state</text>
<rect x="20" y="336" width="1575" height="100" rx="6" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="36" y="396" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">RU1/RU6 units and marks</text>
<text x="625.0" y="396" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">cattle: owner identifiable</text>
<text x="1015.0" y="396" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">owned once caught</text>
<text x="1405.0" y="396" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">V-notch: visible mark</text>
