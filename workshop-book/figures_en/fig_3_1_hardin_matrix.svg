<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 860" width="161.5mm" height="86.0mm" role="img" aria-labelledby="t d"><title id="t">Hardin, roving bandits and Maine lobster</title><desc id="d">Comparison of three systems on SES variables: Hardin's pasture, roving bandits, Maine lobster.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="860" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
