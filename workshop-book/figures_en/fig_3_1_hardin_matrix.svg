<text x="625.0" y="720" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">overharvest (theoretical)</text>
<text x="1015.0" y="720" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">overharvest occurred</text>
<text x="1405.0" y="720" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="middle" letter-spacing="0">recovery after collapse</text>
<text x="36" y="800" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="700" fill="#147C80" text-anchor="start" letter-spacing="0">Lesson: where Hardin's assumptions hold, his prediction holds; the question is where they hold.</text>
<text x="1585" y="848" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Source: Ostrom (2007) PNAS, Hardin and Roving Bandits sections; original table</text></svg>