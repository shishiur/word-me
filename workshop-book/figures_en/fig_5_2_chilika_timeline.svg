<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1244" width="161.5mm" height="124.4mm" role="img" aria-labelledby="t d"><title id="t">Chilika timeline</title><desc id="d">Main commons-related events in Chilika Lagoon from the 18th century to 2010, with page references to Nayak &amp; Berkes (2011).</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1244" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<line x1="330" y1="40" x2="330" y2="1124" stroke="#103553" stroke-width="6"/>
<circle cx="330" cy="70" r="15" fill="#4E7960"/>
<text x="300" y="81" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#4E7960" text-anchor="end" letter-spacing="0">Early 18th century</text>
<text x="370" y="81" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Documentary evidence of caste-based fishing rules</text>
<text x="1590" y="81" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.135</text>
<circle cx="330" cy="162" r="15" fill="#4E7960"/>
<text x="300" y="173" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#4E7960" text-anchor="end" letter-spacing="0">1942</text>
<text x="370" y="173" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Lease system: fisher villages and fisher castes only</text>
<text x="1590" y="173" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.135</text>
<circle cx="330" cy="254" r="15" fill="#4E7960"/>
<text x="300" y="265" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#4E7960" text-anchor="end" letter-spacing="0">After 1959</text>
<text x="370" y="265" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Village cooperatives (PFCS) become the key institution</text>
<text x="1590" y="265" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.135</text>
<circle cx="330" cy="346" r="15" fill="#55636E"/>
<text x="300" y="357" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#55636E" text-anchor="end" letter-spacing="0">1965</text>
<text x="370" y="357" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Lease fee +10% per year (about 30 years)</text>
<text x="1590" y="357" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.139</text>
<circle cx="330" cy="438" r="15" fill="#B6684F"/>
<text x="300" y="449" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">1974</text>
<text x="370" y="449" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Nalabana bird sanctuary, 1,553 ha; rights of four Tiara villages withdrawn</text>
<text x="1590" y="449" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.137</text>
<circle cx="330" cy="530" r="15" fill="#B6684F"/>
<text x="300" y="541" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">1980s</text>
<text x="370" y="541" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Shrimp-farming boom; MOU with Tata</text>
<text x="1590" y="541" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">pp.137–138</text>
<circle cx="330" cy="622" r="15" fill="#B6684F"/>
<text x="300" y="633" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">1991</text>
<text x="370" y="633" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">New lease policy: farming legal, 6,000 ha to non-fisher villages; fee +27%</text>
<text x="1590" y="633" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">pp.138–139</text>
<circle cx="330" cy="714" r="15" fill="#B6684F"/>
<text x="300" y="725" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">1991–92</text>
<text x="370" y="725" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">State-level FISHFED and Chilika Development Authority (CDA)</text>
<text x="1590" y="725" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.139</text>
<circle cx="330" cy="806" r="15" fill="#103553"/>
<text x="300" y="817" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#103553" text-anchor="end" letter-spacing="0">1993–1997</text>
<text x="370" y="817" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">High Court, Supreme Court, Assembly committee: shrimp farming banned</text>
<text x="1590" y="817" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.138</text>
<circle cx="330" cy="898" r="15" fill="#103553"/>
<text x="300" y="909" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#103553" text-anchor="end" letter-spacing="0">2001</text>
<text x="370" y="909" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">State ban and 1991 policy cancelled; artificial new sea mouth</text>
<text x="1590" y="909" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">pp.138, 140</text>
<circle cx="330" cy="990" r="15" fill="#B6684F"/>
<text x="300" y="1001" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">2002–2008</text>
<text x="370" y="1001" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Mean income of caste-fisher households down 70–80%</text>
<text x="1590" y="1001" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.140</text>
<circle cx="330" cy="1082" r="15" fill="#B6684F"/>
<text x="300" y="1093" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#B6684F" text-anchor="end" letter-spacing="0">2010</text>
<text x="370" y="1093" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Illegal farming continues: &gt;60% of fishing area (conservative)</text>
<text x="1590" y="1093" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">p.138</text>
<text x="1595" y="1224" font-family="Tinos, Noto Serif Bengali, serif" font-size="25" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">All dates from Nayak &amp; Berkes (2011). Green = commonising, red = decommonising, blue = legal/environmental intervention.</text></svg>