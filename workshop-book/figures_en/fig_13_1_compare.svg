<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1060" width="161.5mm" height="106.0mm" role="img" aria-labelledby="t d"><title id="t">Chilika vs Sri Lanka</title><desc id="d">Two-column comparison: type of commons, users, drivers, institutions, rules and evidence of success; design caution below.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1060" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="40" y="30" width="745" height="90" rx="12" fill="#B6684F" stroke="none" stroke-width="0" opacity="1"/>
<text x="412.5" y="88" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">Chilika, India: decommonisation</text>
<rect x="830" y="30" width="745" height="90" rx="12" fill="#4E7960" stroke="none" stroke-width="0" opacity="1"/>
<text x="1202.5" y="88" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">NW Sri Lanka: commonisation</text>
<rect x="40" y="150" width="1535" height="100" rx="8" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="186" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">Which 'commons'?</text>
<text x="60" y="230" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">customary capture-fishing grounds of the lagoon</text>
<text x="850" y="230" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">three lagoons + Dutch canal: shared water source</text>
<rect x="40" y="268" width="1535" height="100" rx="8" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="304" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">Who are the users?</text>
<text x="60" y="348" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">caste fishers vs non-fisher upper castes</text>
<text x="850" y="348" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">~600 small family shrimp farms</text>
<rect x="40" y="386" width="1535" height="100" rx="8" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="422" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">Drivers</text>
<text x="60" y="466" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">global shrimp prices; state policy</text>
<text x="850" y="466" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">disease crisis 1988–98; big firms bankrupt</text>
<rect x="40" y="504" width="1535" height="100" rx="8" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="540" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">Institutions</text>
<text x="60" y="584" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">cooperatives defunct; CDA, FISHFED centralised</text>
<text x="850" y="584" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">associations ×18 → zones ×5 → SLADA + NAQDA</text>
<rect x="40" y="622" width="1535" height="100" rx="8" fill="#F4F9F8" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="658" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">Key rules</text>
<text x="60" y="702" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">lease fee +27%; 1991 policy</text>
<text x="850" y="702" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">zonal crop calendar: when to draw/release water</text>
<rect x="40" y="740" width="1535" height="100" rx="8" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="807" y="776" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="700" fill="#55636E" text-anchor="middle" letter-spacing="0">Evidence of success</text>
<text x="60" y="820" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">data on income, cooperatives, encroachment</text>
<text x="850" y="820" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">national production growth (aggregate indicator)</text>
<rect x="40" y="870" width="1535" height="170" rx="12" fill="#FBF4E6" stroke="#D8A34A" stroke-width="3" opacity="1"/>
<text x="62" y="918" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="32" font-weight="700" fill="#8a5d0c" text-anchor="start" letter-spacing="0">Design caution (per the Methods section)</text>
<text x="62" y="968" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Chosen for 'compatibility in data collection approach and close time frame (2007–2014)', not matched on outcome.</text>
<text x="62" y="1012" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">The comparison is an illustrative contrast, not a controlled comparison that varies one factor.</text></svg>