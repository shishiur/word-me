<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 620" width="161.5mm" height="62.0mm" role="img" aria-labelledby="t d"><title id="t">The Sri Lankan shrimp dilemma</title><desc id="d">Left: how disease spreads without coordination; right: the institutional fix through the zonal crop calendar.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="620" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="40" y="40" width="700" height="520" rx="14" fill="#F8ECE7" stroke="#B6684F" stroke-width="3" opacity="1"/>
<text x="70" y="95" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#B6684F" text-anchor="start" letter-spacing="0">Without coordination</text>
<text x="70" y="160.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Disease detected on farm A</text>
<text x="70" y="205.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ individually rational: harvest early</text>
<text x="70" y="250.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">  and dump infected water into the canal</text>
<text x="70" y="295.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ WSSV spreads through shared water</text>
<text x="70" y="340.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ farms B, C, D lose their crop</text>
<text x="70" y="385.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">= subtractability problem: one user's</text>
<text x="70" y="430.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">  use lowers the 'quality' of others' water</text>
<rect x="875" y="40" width="700" height="520" rx="14" fill="#EDF3EE" stroke="#4E7960" stroke-width="3" opacity="1"/>
<text x="905" y="95" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="36" font-weight="700" fill="#4E7960" text-anchor="start" letter-spacing="0">With the crop calendar</text>
<text x="905" y="160.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">5 zones, 32 sub-zones; annual schedule</text>
<text x="905" y="205.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ which zone draws/releases water when</text>
<text x="905" y="250.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ releasing infected water prohibited</text>
<text x="905" y="295.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ associations + extension officers monitor</text>
<text x="905" y="340.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">→ membership incentives: lab tests,</text>
<text x="905" y="385.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">  compensation, disinfectant subsidies</text>
<text x="905" y="430.0" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="30" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">= institutional answer to exclusion and subtractability</text>
<line x1="745" y1="300" x2="870" y2="300" stroke="#147C80" stroke-width="6" marker-end="url(#ah-solid)"/>
<text x="1595" y="605" font-family="Tinos, Noto Serif Bengali, serif" font-size="24" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Source: Galappaththi &amp; Nayak (2017), Results and Table 3; Berkes &amp; Franz (2025) ch.3 box. Original figure.</text></svg>