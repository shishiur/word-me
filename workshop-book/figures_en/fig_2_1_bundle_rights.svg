<text x="55" y="772" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="33" font-weight="700" fill="#B6684F" text-anchor="start" letter-spacing="0">The Chilika paradox (Nayak &amp; Berkes 2011, p.142)</text>
<text x="55" y="825" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Leases gave fisher villages legal access and withdrawal; management, exclusion and alienation were de facto.</text>
<text x="55" y="872" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">By 2010, though still paying lease fees, they held not one right in practice; encroachers had moved from 'thin access'</text>
<text x="55" y="916" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">to full de facto rights. Rights on paper ≠ the power to exercise them.</text>
<text x="1585" y="950" font-family="Tinos, Noto Serif Bengali, serif" font-size="26" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Concept: Schlager &amp; Ostrom (1992), cited in W10 §5.3; original redraw</text></svg>