<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 1200" width="161.5mm" height="120.0mm" role="img" aria-labelledby="t d"><title id="t">Research bridge: hypothesised pathways</title><desc id="d">Two-layer network: above, water condition, fish physiology, gut and water microbiomes, migration; below, leases, bans, fishing pressure, livelihoods. Most arrows are dashed or dotted, i.e. hypothesised or uncertain.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="1200" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
