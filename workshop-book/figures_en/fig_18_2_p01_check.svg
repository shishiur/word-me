<text x="1030" y="72" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">What another part says</text>
<rect x="20" y="110" width="1575" height="82" rx="6" fill="#F8ECE7" stroke="none" stroke-width="0" opacity="1"/>
<text x="40" y="162" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">Sample size</text>
<text x="450" y="162" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Methods: 60 per site</text>
<text x="1030" y="162" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#B6684F" text-anchor="start" letter-spacing="0">Results: 30 per site (90 total)</text>
<rect x="20" y="200" width="1575" height="82" rx="6" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="40" y="252" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">Tissue</text>
<text x="450" y="252" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">Stored: fins, in ethanol</text>
<text x="1030" y="252" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#B6684F" text-anchor="start" letter-spacing="0">DNA: 'from muscle tissue'</text>
<rect x="20" y="290" width="1575" height="82" rx="6" fill="#F8ECE7" stroke="none" stroke-width="0" opacity="1"/>
<text x="40" y="342" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">Haplotypes</text>
<text x="450" y="342" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">only 3 haplotypes</text>
<text x="1030" y="342" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#B6684F" text-anchor="start" letter-spacing="0">Hd = 1.000 ('every sample unique')</text>
<rect x="20" y="380" width="1575" height="82" rx="6" fill="#fff" stroke="none" stroke-width="0" opacity="1"/>
<text x="40" y="432" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">Diversity value</text>
<text x="450" y="432" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">π is a per-site proportion (usually &lt;0.05)</text>
<text x="1030" y="432" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#B6684F" text-anchor="start" letter-spacing="0">Reported: PiJC = 2.50198</text>
