<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 700" width="161.5mm" height="70.0mm" role="img" aria-labelledby="t d"><title id="t">P01 internal consistency check</title><desc id="d">Internal inconsistencies at six checkpoints and the result of the reference check.</desc><defs><marker id="ah-solid" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker><marker id="ah-dotted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1615" height="700" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/>
<rect x="20" y="20" width="1575" height="80" rx="10" fill="#103553" stroke="none" stroke-width="0" opacity="1"/>
<text x="40" y="72" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="31" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">Checkpoint</text>
