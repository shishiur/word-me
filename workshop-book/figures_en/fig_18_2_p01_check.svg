<text x="450" y="612" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">1 matched (Sultana et al. 2022)</text>
<text x="1030" y="612" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#B6684F" text-anchor="start" letter-spacing="0">3 resolve to unrelated papers</text>
<text x="1595" y="690" font-family="Tinos, Noto Serif Bengali, serif" font-size="24" font-weight="400" fill="#55636E" text-anchor="end" letter-spacing="0">Source: Sunny et al. (2025) EJABF 29(1):1089–1105, full text; DOI check via Crossref API, 6 November 2026</text></svg>