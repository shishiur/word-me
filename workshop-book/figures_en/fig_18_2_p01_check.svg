<text x="40" y="522" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="29" font-weight="700" fill="#103553" text-anchor="start" letter-spacing="0">Differentiation</text>
<text x="450" y="522" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#1B232B" text-anchor="start" letter-spacing="0">FST is a population-level measure</text>
<text x="1030" y="522" font-family="Noto Sans Bengali, Tinos, sans-serif" font-size="28" font-weight="400" fill="#B6684F" text-anchor="start" letter-spacing="0">Compared with: single GenBank accessions</text>
